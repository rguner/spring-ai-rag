server:
  port: 8080

spring:
  application:
    name: spring-ai-rag
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2
      embedding:
        options:
          model: nomic-embed-text

app:
  rag:
    top-k: 4
    similarity-threshold: 0.0

logging:
  level:
    org.springframework.ai: INFO
